[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "badapple-unicode"
version = "0.1.0"
description = "One Unicode character per Bad Apple frame, with exhaustive glyph matching"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "Pillow>=10.4", "fonttools>=4.53", "aggdraw>=1.3.18", "unicodedata2==17.0.0"]

[project.optional-dependencies]
cpu = ["faiss-cpu>=1.8"]
gpu = ["torch>=2.4"]
test = ["pytest>=8"]

[project.scripts]
badapple-unicode = "badapple_unicode.cli:main"

[tool.setuptools.packages.find]
include = ["badapple_unicode*"]

[tool.setuptools.package-data]
badapple_unicode = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
